name: collect

on:
  schedule:
    # 매시 5분 (UTC). GitHub 사정에 따라 몇 분 늦을 수 있습니다.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      briefing:
        description: "브리핑을 강제로 생성"
        type: boolean
        default: false
      dry_run:
        description: "LLM 호출 없이 수집만 확인"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집 실행
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python collector/collect.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.briefing && '--briefing' || '' }}

      - name: 결과 커밋
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: 뉴스 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 다른 실행과 겹쳤을 때를 대비해 rebase 후 재시도
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 ${attempt}"
            sleep 5
          done
          exit 1
